name: Publish Moonbook v0.1.0 IPA
on:
  push:
    branches: [codex/moonbook-ios]
    paths: [.github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: moonbook-release-v0.1.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: alicelikeeat/moonbook
      SOURCE_SHA: fb32c9acbe52329fac03f1384913adfac2588d49
    steps:
      - name: Verify source build succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/alicelikeeat/moonbook/actions/runs/42550102173 > run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          assert run['head_sha'] == os.environ['SOURCE_SHA'], 'Unexpected source commit'
          assert run['conclusion'] == 'success', 'Source build has not passed'
          PY
      - name: Download verified unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: Moonbook-unsigned-ipa
          run-id: 42550102173
          github-token: ${{ github.token }}
          path: package
      - name: Check package
        working-directory: package
        run: |
          sha256sum -c Moonbook-unsigned.ipa.sha256
          unzip -t Moonbook-unsigned.ipa
          python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile('Moonbook-unsigned.ipa') as archive:
              info = plistlib.loads(archive.read('Payload/Moonbook.app/Info.plist'))
              assert info['CFBundleSupportedPlatforms'] == ['iPhoneOS']
              assert info['CFBundleShortVersionString'] == '0.1.0'
              assert 'Payload/Moonbook.app/Moonbook' in archive.namelist()
          PY
      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Moonbook 本地小说阅读器第一版，支持 TXT / EPUB 导入、章节目录、书签、自动续读与阅读主题。

          下载下方的 **Moonbook-unsigned.ipa**，这是适用于 iOS 17+ iPhone / iPad 的 arm64 未签名 Release 包，需要自行签名后安装。

          EPUB 目前只显示文字，不保留图片与原书 CSS；阅读采用上下滚动。

          已验证真机版构建、IPA 完整性及 SHA-256，模拟器的 7 项 XCTest 全部通过。尚未进行真机人工验证。
          NOTES
          gh release create v0.1.0 package/Moonbook-unsigned.ipa package/Moonbook-unsigned.ipa.sha256 \
            --target "$SOURCE_SHA" --title 'Moonbook v0.1.0 · 未签名 IPA' \
            --notes-file notes.md --draft
          gh release view v0.1.0 --json assets --jq '.assets[].name' > assets.txt
          grep -Fx 'Moonbook-unsigned.ipa' assets.txt
          grep -Fx 'Moonbook-unsigned.ipa.sha256' assets.txt
          gh release edit v0.1.0 --draft=false --latest
